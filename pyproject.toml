[project]
name = "rag_project"
version = "0.1.0"
description = "A comprehensive RAG (Retrieval-Augmented Generation) project"
authors = ["Developer <developer@example.com>"]
dependencies = [
    "milvus==2.4.0",
    "pymilvus==2.4.0",
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pydantic==2.5.2",
    "python-dotenv==1.0.0",
    "sentence-transformers==2.2.2",
    "transformers==4.36.2",
    "torch==2.1.0",
    "langchain==0.1.0",
    "openai==1.13.3",
    "python-multipart==0.0.6",
    "aiofiles==23.2.1",
    "python-docx==1.1.0",
    "PyMuPDF==1.23.10",
    "pandas==2.1.4",
    "openpyxl==3.1.2",
    "unstructured==0.14.0",
    "scikit-learn==1.3.2",
    "numpy==1.26.2",
    "pytest==7.4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"